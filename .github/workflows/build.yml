name: build
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # LLVM 20, the same version the tested binary was built with, so the release hash matches a local build
      - run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | sudo tee /etc/apt/sources.list.d/llvm20.list
          sudo apt-get update && sudo apt-get install -y clang-20 lld-20
      - run: CC=clang-20 LLD_LINK=lld-link-20 ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LegionCbmrFix
          path: out/LegionCbmrFix.efi
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && zip ../LegionCbmrFix-${GITHUB_REF_NAME}.zip LegionCbmrFix.efi && cd ..
          gh release upload "$GITHUB_REF_NAME" LegionCbmrFix-${GITHUB_REF_NAME}.zip
